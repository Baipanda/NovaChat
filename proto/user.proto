syntax = "proto3";

package novachat;

option cc_generic_services = true;

import "common.proto";

// 用户资料（昵称 / 在线状态 / 头像），供 ChatServer 经 RPC 查询
message UserInfo {
  int32 id = 1;
  bytes name = 2;
  bytes state = 3;    // online / offline
  bytes avatar = 4;   // URL
}

message GetUserProfileRequest {
  int32 userid = 1;
}

message GetUserProfileResponse {
  ResultCode result = 1;
  UserInfo user = 2;
}

service UserServiceRpc {
  // 按 userid 查询昵称、头像、在线状态等资料
  rpc GetUserProfile(GetUserProfileRequest) returns (GetUserProfileResponse);
}
