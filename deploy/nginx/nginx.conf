# NovaChat Nginx 反代（容器 --network host）
# 对外 :8090 → 静态页 :8088 + WebSocket /ws → :8089

worker_processes 1;
error_log /tmp/novachat_nginx_error.log warn;
pid /tmp/novachat_nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log /tmp/novachat_nginx_access.log;
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile on;

    upstream novachat_http {
        server 127.0.0.1:8088;
    }
    upstream novachat_ws {
        server 127.0.0.1:8089;
    }

    server {
        listen 8090;
        server_name _;

        location / {
            proxy_pass http://novachat_http;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # WebSocket：浏览器连 ws://host:8090/ws
        location /ws {
            proxy_pass http://novachat_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
