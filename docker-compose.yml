services:
  mysql:
    image: mysql:8.0
    container_name: novachat-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "100103"
      MYSQL_DATABASE: chat
    ports:
      - "3307:3306"
    volumes:
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]

  redis:
    image: redis:alpine
    container_name: novachat-redis
    ports:
      - "6380:6379"
