<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NovaChat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="login-overlay" id="loginOverlay">
    <div class="login-card">
      <h1>NovaChat</h1>
      <p>分布式 IM · RPC 查用户资料 · Redis 推消息 · ZK 服务发现</p>
      <label>User ID（1 alice / 2 bob / 3 carol）</label>
      <input id="uid" value="1" />
      <label>Password</label>
      <input id="pwd" type="password" value="123456" />
      <div class="btn-row">
        <button id="btnLogin" type="button">Login</button>
        <button class="ghost" id="btnRefreshZk" type="button">Refresh ZK</button>
      </div>
      <div class="login-hint" id="loginStatus">disconnected</div>
      <div class="zk-panel">
        <strong>ZooKeeper</strong> <span id="zkPath">/NovaChat-service/UserServiceRpc</span>
        <ul class="zk-nodes" id="zkNodes"><li>loading…</li></ul>
      </div>
    </div>
  </div>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <span class="brand-icon">⬡</span>
          <span class="brand-name">NovaChat</span>
        </div>
        <div class="header-actions">
          <div class="menu-wrap" id="composeWrap">
            <button class="icon-btn" id="btnCompose" title="新建" type="button" aria-haspopup="true">
              <svg class="icon" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </button>
            <div class="dropdown hidden" id="composeMenu" role="menu">
              <button type="button" data-action="add-friend">添加好友</button>
              <button type="button" data-action="create-group">创建群聊</button>
              <button type="button" data-action="join-group">加入群聊</button>
            </div>
          </div>
          <button class="icon-btn" id="themeToggle" title="Theme" type="button">
            <svg class="icon sun-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            <svg class="icon moon-icon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>
          <button class="icon-btn" id="btnLogout" title="Logout" type="button">
            <svg class="icon" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          </button>
        </div>
      </div>

      <div class="search-wrap">
        <svg class="search-icon icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" class="search-input" id="searchInput" placeholder="搜索…" />
      </div>

      <div class="sidebar-scroll">
        <section class="nav-section" data-section="friends">
          <button type="button" class="section-toggle" id="toggleFriends" aria-expanded="true">
            <svg class="chevron icon" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
            <span>好友</span>
            <span class="section-count" id="friendCount">0</span>
          </button>
          <ul class="contact-list" id="contactList"></ul>
        </section>

        <section class="nav-section" data-section="groups">
          <button type="button" class="section-toggle" id="toggleGroups" aria-expanded="true">
            <svg class="chevron icon" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
            <span>群聊</span>
            <span class="section-count" id="groupCount">0</span>
          </button>
          <ul class="contact-list" id="groupList"></ul>
        </section>
      </div>

      <div class="sidebar-footer">
        <div class="my-avatar-wrap">
          <div class="avatar avatar-me" id="myAvatar" style="background:var(--accent)"><span id="myInitial">?</span>
            <span class="status-dot online"></span>
          </div>
          <div class="my-info">
            <div class="my-name" id="myName">Guest</div>
            <div class="my-status" id="myStatus">offline</div>
          </div>
        </div>
        <button type="button" class="link-btn" id="btnZkToggle" title="ZK 节点">ZK</button>
      </div>
      <div class="zk-live hidden" id="zkLivePanel">
        <ul class="zk-nodes" id="zkNodesLive"><li>—</li></ul>
      </div>
    </aside>

    <main class="chat-main" id="chatMain">
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">⬡</div>
        <h2>Welcome to NovaChat</h2>
        <p>选择左侧会话，或点「+」添加好友 / 建群</p>
      </div>

      <div class="chat-window hidden" id="chatWindow">
        <div class="chat-topbar">
          <button class="icon-btn back-btn" id="backBtn" type="button">
            <svg class="icon" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <button type="button" class="topbar-peer" id="topbarPeerBtn" title="会话信息">
            <div class="topbar-avatar-wrap" id="topbarAvatar"></div>
            <div class="topbar-info">
              <div class="topbar-name" id="topbarName">—</div>
              <div class="topbar-status" id="topbarStatus">—</div>
            </div>
          </button>
          <div class="topbar-actions">
            <div class="menu-wrap" id="chatMoreWrap">
              <button class="icon-btn" id="btnChatMore" title="更多" type="button">
                <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
              </button>
              <div class="dropdown dropdown-right hidden" id="chatMoreMenu" role="menu">
                <button type="button" class="hidden" id="menuViewMembers" data-action="view-members">群成员</button>
                <button type="button" class="hidden" id="menuDelFriend" data-action="del-friend">删除好友</button>
                <button type="button" class="hidden danger" id="menuQuitGroup" data-action="quit-group">退出群聊</button>
              </div>
            </div>
          </div>
        </div>
        <div class="messages-area" id="messagesArea"></div>
        <div class="input-bar">
          <div class="input-wrap" style="flex:1">
            <textarea class="msg-input" id="msgInput" placeholder="Message…" rows="1"></textarea>
          </div>
          <button class="send-btn" id="sendBtn" title="Send" type="button">
            <svg class="icon" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
      </div>

      <aside class="info-drawer hidden" id="infoDrawer" aria-hidden="true">
        <div class="drawer-header">
          <h3 id="drawerTitle">群成员</h3>
          <button type="button" class="icon-btn" id="btnCloseDrawer" title="关闭">
            <svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <p class="drawer-sub" id="drawerSub"></p>
        <ul class="member-list" id="memberList"></ul>
      </aside>
    </main>
  </div>

  <div class="modal-backdrop hidden" id="modalBackdrop">
    <div class="modal" id="modal" role="dialog" aria-modal="true">
      <div class="modal-header">
        <h3 id="modalTitle">—</h3>
        <button type="button" class="icon-btn" id="btnCloseModal" title="关闭">
          <svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer">
        <button type="button" class="btn ghost" id="btnModalCancel">取消</button>
        <button type="button" class="btn primary" id="btnModalOk">确定</button>
      </div>
    </div>
  </div>

  <div class="toast hidden" id="toast"></div>
  <div class="sidebar-overlay hidden" id="sidebarOverlay"></div>
  <script src="app.js"></script>
</body>
</html>
